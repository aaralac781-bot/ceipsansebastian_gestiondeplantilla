<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aula del Presente: Biblioteca</title>
<meta name="theme-color" content="#2D6A30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblioteca">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 35%,#4E9A4F 0%,#2D6A30 50%,#1C4520 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
    padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
  .logo{width:132px;height:132px;border-radius:30px;box-shadow:0 10px 40px rgba(242,193,78,.35)}
  h1{font-size:28px;margin:22px 0 4px}
  h1 span{color:#F2C14E}
  p.sub{opacity:.85;font-size:15px}
  .btn{display:inline-block;margin-top:28px;background:#F2C14E;color:#1C4520;font-weight:800;font-size:18px;padding:14px 34px;border-radius:40px;text-decoration:none;border:0;cursor:pointer}
  .btn2{display:inline-block;margin-top:12px;color:#fff;font-size:14px;text-decoration:underline;opacity:.85}
  .nota{margin-top:16px;font-size:13px;opacity:.8;max-width:340px;line-height:1.45}
  .cfg{display:none;margin-top:24px;width:100%;max-width:380px}
  .cfg input{width:100%;padding:12px;border-radius:12px;border:0;font-size:15px}
  .cfg .btn{margin-top:12px;font-size:16px;padding:11px 26px}
</style>
</head>
<body>
  <img class="logo" src="icono-512.png" alt="Garzastián leyendo">
  <h1>Aula del Presente: <span>Biblioteca</span></h1>
  <p class="sub">CEIP San Sebastián · La Puebla del Río</p>
  <a class="btn" id="entrar" href="#">Entrar (profesorado)</a>
  <a class="btn2" id="publica" href="#">Entrar sin cuenta (familias)</a>
  <p class="nota" id="nota">El profesorado entra con su cuenta @g.educaand.es.</p>
  <div class="cfg" id="cfg">
    <p class="nota">Pega aquí la dirección de la app (la que termina en <b>/exec</b>). Solo hay que hacerlo una vez.</p>
    <input id="url" type="url" placeholder="https://script.google.com/macros/s/…/exec">
    <button class="btn" id="guardar">Guardar y entrar</button>
  </div>
<script>
  /* ⬇⬇ DIRECCIÓN DE LA APP (termina en /exec). Si se deja vacía, la pide la primera vez ⬇⬇ */
  var APP = 'https://script.google.com/a/macros/g.educaand.es/s/AKfycbyI5BE8WgiqUaffSX284OabmL7iZqdXpg67ek5l9mJVC_XfqwH2lLjKJ2Gdqiv76N1H/exec';
  /* ⬆⬆ ----------------------------------------------------------------------- ⬆⬆ */
  var guardada = ''; try { guardada = localStorage.getItem('bibliotecaApp') || ''; } catch (e) {}
  var m = String(APP || guardada).match(/\/s\/([\w-]{20,})\/exec/), ID = m ? m[1] : '';
  var URL_PUB = 'https://script.google.com/macros/s/' + ID + '/exec';
  var URL_DOM = 'https://script.google.com/a/macros/g.educaand.es/s/' + ID + '/exec';
  var ELEGIR = 'https://accounts.google.com/AccountChooser?continue=' + encodeURIComponent(URL_DOM) + '&hd=g.educaand.es';
  var $ = function (id) { return document.getElementById(id); };
  if (!ID) {
    $('entrar').style.display = 'none'; $('publica').style.display = 'none'; $('nota').style.display = 'none'; $('cfg').style.display = 'block';
    $('guardar').onclick = function () {
      var u = $('url').value.trim();
      if (!/^https:\/\/script\.google\.com\/.+\/s\/[\w-]{20,}\/exec/.test(u)) { $('url').style.outline = '3px solid #B71D27'; return; }
      try { localStorage.setItem('bibliotecaApp', u); } catch (e) {}
      location.reload();
    };
  } else {
    $('entrar').href = ELEGIR;
    $('publica').href = URL_PUB + '?vista=publica';
    var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    $('nota').innerHTML = ios ? 'Para tenerla como app: pulsa <b>Compartir</b> → <b>Añadir a pantalla de inicio</b>.' : 'Para tenerla como app: menú <b>⋮</b> → <b>Añadir a pantalla de inicio</b>.';
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
