<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consejo Escolar · CEIP San Sebastián</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ground:#eef2ed;--surface:#fff;--surface2:#f6f9f5;--ink:#15231c;--muted:#5b6b61;--faint:#8a998f;
  --line:#dde5dd;--line2:#c7d2c7;--primary:#1c6b45;--primary-deep:#0f4d31;--primary-soft:#e3f0e7;
  --gold:#9a6b12;--gold-soft:#f6edd8;--red:#b3261e;--red-soft:#fbe6e4;--blue:#2f6fb0;
  --active:#1c6b45;--active-soft:#dcefe2;--past:#8a998f;--past-soft:#eef1ee;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3,.serif{font-family:"Spectral",Georgia,serif}
.tnum{font-variant-numeric:tabular-nums}
.bar{position:sticky;top:0;z-index:20;background:var(--primary-deep);color:#fff;padding:13px 16px;box-shadow:0 2px 12px rgba(15,77,49,.28)}
.bar-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:11px}
.crest{width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.crest svg{width:21px;height:21px}
.bar h1{margin:0;font-size:1.08rem;font-weight:700;line-height:1.15}
.bar .sub{font-size:.7rem;opacity:.82;margin-top:1px}
.tabs{position:sticky;top:62px;z-index:19;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs-in{max-width:820px;margin:0 auto;display:flex;gap:2px;padding:0 8px;overflow-x:auto}
.tab{border:none;background:none;cursor:pointer;padding:12px 13px;font:inherit;font-weight:600;font-size:.88rem;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--primary);border-color:var(--primary)}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(20,40,30,.05),0 6px 18px rgba(20,40,30,.05);margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:1.1rem}
.lead{color:var(--muted);font-size:.85rem;margin:0 0 12px}
label{display:block;font-size:.74rem;font-weight:700;letter-spacing:.02em;color:var(--muted);margin:0 0 5px}
input,textarea,select{width:100%;font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface2);border:1.5px solid var(--line2);border-radius:9px;padding:9px 11px}
textarea{min-height:110px;resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.btn{border:none;cursor:pointer;font:inherit;font-weight:700;font-size:.9rem;border-radius:10px;padding:10px 15px;background:var(--primary);color:#fff}
.btn:hover{filter:brightness(1.06)} .btn:active{filter:brightness(.95)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1.5px solid var(--line2)}
.btn.gold{background:var(--gold);color:#fff} .btn.red{background:var(--red);color:#fff}
.btn.sm{padding:6px 11px;font-size:.8rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.grow{flex:1;min-width:150px}
.hint{font-size:.76rem;color:var(--faint);margin-top:6px}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:22px 4px 10px}
.msg{border-radius:10px;padding:11px 13px;font-size:.85rem;margin:8px 0}
.msg.ok{background:var(--active-soft);color:var(--primary-deep)}
.msg.err{background:var(--red-soft);color:var(--red)}
.msg.info{background:#e7f0f8;color:#1b4a72}
.msg.warn{background:var(--gold-soft);color:var(--gold)}
/* calendario */
.next{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.next.urgent{border-left-color:var(--red)}
.next .k{font-size:.66rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}
.next.urgent .k{color:var(--red)}
.next .t{font-family:"Spectral",serif;font-size:1.1rem;font-weight:600;margin-top:3px}
.next .d{font-size:.82rem;color:var(--muted);margin-top:3px}
.ev{display:grid;grid-template-columns:70px 1fr;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:7px}
.ev .dd{font-family:"Spectral",serif;font-size:1.35rem;font-weight:600;line-height:1}
.ev .mo{font-size:.68rem;color:var(--muted);text-transform:uppercase}
.ev .ti{font-weight:600;font-size:.92rem}
.ev .num{font-size:.64rem;color:var(--faint);font-weight:700}
.chip{display:inline-block;font-size:.64rem;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:6px}
.ev.past{opacity:.7}.ev.past .chip{background:var(--past-soft);color:var(--past)}
.ev.active{border-color:var(--active)}.ev.active .chip{background:var(--active-soft);color:var(--active)}
.ev.soon .chip{background:var(--gold-soft);color:var(--gold)}
.ev.seneca{border-left:4px solid var(--blue)}
.badge{display:inline-block;font-size:.6rem;font-weight:700;color:var(--blue);border:1px solid #9fc0e0;border-radius:6px;padding:0 5px;margin-left:6px}
/* votar */
.vopt{display:block;width:100%;text-align:left;background:var(--surface2);border:1.5px solid var(--line2);border-radius:10px;padding:12px 14px;margin-bottom:8px;font:inherit;font-weight:600;cursor:pointer}
.vopt:hover{border-color:var(--primary);background:var(--primary-soft)}
.bar-res{height:15px;background:var(--primary);border-radius:5px}
.res-row{display:flex;align-items:center;gap:9px;margin-bottom:6px;font-size:.86rem}
.res-row .nm{min-width:120px;font-weight:600}
.res-row .track{flex:1;background:var(--past-soft);border-radius:5px;overflow:hidden}
.res-row .n{min-width:30px;text-align:right;font-weight:800;color:var(--primary)}
.sector{border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:11px;background:var(--surface2)}
.shead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.shead .sn{flex:1;min-width:110px;font-weight:700}
.mini{width:60px!important}
.small{font-size:.72rem;color:var(--muted)}
.rmx{background:none;border:none;color:var(--faint);cursor:pointer;font-size:1.1rem}
.vlist{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--surface2)}
.vlist .vt{font-weight:700}
.pill{display:inline-block;font-size:.66rem;font-weight:700;border-radius:999px;padding:2px 9px}
.pill.on{background:var(--active-soft);color:var(--active)}.pill.off{background:var(--past-soft);color:var(--past)}
.center{text-align:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--primary);border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
footer{max-width:820px;margin:0 auto;padding:6px 16px 34px;color:var(--faint);font-size:.72rem;text-align:center}
@media(max-width:460px){.ev{grid-template-columns:58px 1fr}}
/* documentos */
.doc-item{display:flex;gap:11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:8px}
.doc-item .di-n{width:30px;height:30px;flex-shrink:0;border-radius:8px;background:var(--primary-soft);color:var(--primary-deep);font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.doc-item .di-b{flex:1;min-width:0}
.doc-item .di-t{font-weight:700;font-size:.9rem;line-height:1.25}
.doc-item .di-w{font-size:.72rem;color:var(--muted);margin-top:2px}
.doc-item .tag{display:inline-block;font-size:.6rem;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:5px;padding:1px 6px;margin-left:6px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:10px;padding:30px 34px;font-family:Georgia,"Spectral",serif;color:#15231c;line-height:1.6;box-shadow:0 6px 18px rgba(20,40,30,.08)}
.sheet:focus{outline:2px solid var(--primary-soft)}
.sheet h1{font-size:1.02rem;margin:0 0 3px;text-transform:uppercase}
.sheet h2{font-size:.82rem;color:#555;font-weight:400;margin:0 0 4px}
.sheet .memb{border-bottom:1.5px solid #0f4d31;padding-bottom:8px;margin-bottom:16px}
.sheet .memb .c{font-weight:700;font-family:"Spectral",serif;font-size:1.05rem;color:#0f4d31}
.sheet .memb .s{font-size:.78rem;color:#555}
.sheet p{margin:0 0 11px;text-align:justify}
.sheet ol,.sheet ul{margin:0 0 11px;padding-left:22px}
.sheet li{margin-bottom:4px;text-align:justify}
.sheet .od{background:#f6f9f5;border:1px solid #dde5dd;border-radius:8px;padding:10px 14px;margin:0 0 12px}
.sheet .fecha{margin:22px 0 26px;text-align:right}
.sheet .firma{text-align:center;margin-top:6px;font-weight:700;text-transform:uppercase;font-size:.86rem}
.sheet .firmas{display:flex;justify-content:space-between;gap:24px;margin-top:34px;flex-wrap:wrap}
.sheet .firmas .fb{flex:1;min-width:180px;text-align:center;font-size:.84rem}
.sheet .rule{border:none;border-top:1px solid #444;margin:34px auto 4px;max-width:220px}
.bl{display:inline-block;border-bottom:1px solid #555;min-width:120px;height:1.15em;vertical-align:bottom}
.bl.sm{min-width:52px}.bl.lg{min-width:230px}.bl.xl{min-width:100%}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <div class="crest"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V10l7-5 7 5v11"/><path d="M9 21v-6h6v6"/></svg></div>
  <div><h1>Consejo Escolar</h1><div class="sub">CEIP San Sebastián · La Puebla del Río</div></div>
</div></div>
<div class="tabs"><div class="tabs-in" role="tablist">
  <button class="tab" id="t-cal" role="tab" aria-selected="true" onclick="ir('cal')">📅 Calendario</button>
  <button class="tab" id="t-doc" role="tab" aria-selected="false" onclick="ir('doc')">📄 Documentos</button>
  <button class="tab" id="t-vot" role="tab" aria-selected="false" onclick="ir('vot')">🗳️ Votar</button>
  <button class="tab" id="t-adm" role="tab" aria-selected="false" onclick="ir('adm')">🔒 Administración</button>
</div></div>

<main class="wrap">
  <section id="p-cal"><div id="calNext"></div><div id="calList" class="center"><span class="spin"></span></div></section>
  <section id="p-doc" hidden>
    <div id="docLogin" class="card">
      <h2 class="serif">Documentos de la dirección</h2>
      <p class="lead">Zona privada. Introduce la contraseña de administración.</p>
      <div class="row"><div class="grow"><input type="password" id="docPw" placeholder="Contraseña" onkeydown="if(event.key==='Enter')docEntrar()"></div><button class="btn" onclick="docEntrar()">Entrar</button></div>
      <div id="docLoginMsg"></div>
    </div>
    <div id="docBody" hidden>
      <div id="docCfg"></div>
      <div id="docList"></div>
      <div id="docView" hidden></div>
    </div>
  </section>
  <section id="p-vot" hidden><div id="votBox" class="center"><span class="spin"></span></div></section>
  <section id="p-adm" hidden>
    <div id="admLogin" class="card">
      <h2 class="serif">Zona de administración</h2>
      <p class="lead">Solo la dirección. Introduce la contraseña.</p>
      <div class="row"><div class="grow"><input type="password" id="admPw" placeholder="Contraseña" onkeydown="if(event.key==='Enter')admEntrar()"></div><button class="btn" onclick="admEntrar()">Entrar</button></div>
      <div id="admLoginMsg"></div>
    </div>
    <div id="admPanel" hidden></div>
  </section>
</main>
<footer>App de la dirección · Voto anónimo garantizado · CEIP San Sebastián</footer>

<script>
var CAL=[], VOTS=[], YO='', IDENT=false, ADMINPASS='', LISTADOS=[], SECTORES=null, DOCINIT=false;
var MESAB=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function d(iso){var p=iso.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function hoy0(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
function fLarga(dt){return dt.getDate()+' de '+MES[dt.getMonth()]+' de '+dt.getFullYear();}
function el(id){return document.getElementById(id);}
function srv(fn){var a=[].slice.call(arguments,1);return google.script.run[fn].apply(google.script.run,a);}

function ir(t){
  ['cal','doc','vot','adm'].forEach(function(x){el('p-'+x).hidden=(x!==t);el('t-'+x).setAttribute('aria-selected',x===t);});
  if(t==='doc') gateDoc();
  window.scrollTo(0,0);
}
/* Documentos = zona privada (misma contraseña que Administración) */
function gateDoc(){
  if(ADMINPASS){ el('docLogin').hidden=true; el('docBody').hidden=false; if(!DOCINIT){DOCINIT=true;renderDocCfg();renderDocList();} }
  else { el('docLogin').hidden=false; el('docBody').hidden=true; }
}
function docEntrar(){
  var pw=el('docPw').value; el('docLoginMsg').innerHTML='<div class="center"><span class="spin"></span></div>';
  google.script.run.withSuccessHandler(function(ok){
    if(!ok){ el('docLoginMsg').innerHTML='<div class="msg err">Contraseña incorrecta.</div>'; return; }
    ADMINPASS=pw; el('docLoginMsg').innerHTML=''; gateDoc();
  }).withFailureHandler(function(e){ el('docLoginMsg').innerHTML='<div class="msg err">'+esc(e&&e.message)+'</div>'; }).adminEntrar(pw);
}

/* ---------- arranque ---------- */
google.script.run.withSuccessHandler(function(b){
  CAL=b.calendario||[]; VOTS=b.votaciones||[]; YO=b.email||''; IDENT=!!b.identificado;
  renderCal(); renderVotar();
}).withFailureHandler(function(e){
  el('calList').innerHTML='<div class="msg err">No se pudo cargar. '+esc(e&&e.message)+'</div>';
}).getBootstrap();

/* ---------- CALENDARIO ---------- */
function estado(ev,h){var fin=d(ev.hasta);if(h>fin)return'past';var dif=(fin-h)/86400000;return dif<=10?'active':'soon';}
function renderCal(){
  var h=hoy0();
  var html='';
  CAL.forEach(function(ev){
    var st=estado(ev,h),fin=d(ev.hasta);
    html+='<div class="ev '+st+(ev.sen?' seneca':'')+'"><div class="tnum"><div class="dd">'+fin.getDate()+'</div><div class="mo">'+MESAB[fin.getMonth()]+'</div></div>';
    html+='<div><div class="num">Paso '+ev.n+'</div><div class="ti">'+esc(ev.ti)+(ev.sen?'<span class="badge">Séneca</span>':'')+'</div>';
    html+='<span class="chip">'+(st==='past'?'Plazo vencido':st==='active'?'Pendiente':'Próximo')+'</span></div></div>';
  });
  el('calList').innerHTML=html;
  var pend=CAL.filter(function(ev){return estado(ev,h)!=='past';}).sort(function(a,b){return d(a.hasta)-d(b.hasta);});
  var nb=el('calNext');
  if(!pend.length){nb.innerHTML='';return;}
  var p=pend[0],fin=d(p.hasta),dif=Math.round((fin-h)/86400000),urg=dif<=4;
  var falta=dif===0?' · ¡es hoy!':(dif===1?' · queda 1 día':' · quedan '+dif+' días');
  nb.innerHTML='<div class="next'+(urg?' urgent':'')+'"><div class="k">Lo siguiente'+(p.sen?' · en Séneca':'')+'</div><div class="t">'+esc(p.ti)+'</div><div class="d">Antes del '+fLarga(fin)+falta+'</div></div>';
}

/* ---------- VOTAR ---------- */
function renderVotar(){
  var b=el('votBox');
  if(!IDENT){ b.innerHTML='<div class="card"><div class="msg warn">No se ha reconocido tu cuenta. Abre esta app con tu cuenta <b>@g.educaand.es</b> para poder votar.</div></div>'; return; }
  var h='<div class="card"><div class="msg info">Entras como <b>'+esc(YO)+'</b>. Tu voto es <b>anónimo</b>: nadie puede saber qué has votado.</div></div>';
  if(!VOTS.length){ h+='<div class="card center" style="color:var(--muted)">No hay votaciones abiertas ahora mismo.</div>'; b.innerHTML=h; return; }
  VOTS.forEach(function(v,i){
    h+='<div class="card" id="vc-'+i+'"><h2 class="serif" style="font-size:1.05rem">'+esc(v.titulo)+'</h2>';
    if(v.yaVoto){ h+='<div class="msg ok">✅ Ya has votado en esta votación. ¡Gracias!</div>'; }
    else { v.opciones.forEach(function(o,k){ h+='<button class="vopt" onclick="votar('+i+','+k+')">'+esc(o)+'</button>'; }); }
    h+='</div>';
  });
  b.innerHTML=h;
}
function votar(i,k){
  var v=VOTS[i]; if(!v||v.yaVoto)return;
  if(!confirm('¿Confirmas tu voto por "'+v.opciones[k]+'"? No se puede cambiar.'))return;
  var card=el('vc-'+i); card.innerHTML='<div class="center"><span class="spin"></span></div>';
  google.script.run.withSuccessHandler(function(r){
    v.yaVoto=true;
    card.innerHTML='<h2 class="serif" style="font-size:1.05rem">'+esc(v.titulo)+'</h2><div class="msg ok">✅ Voto registrado. ¡Gracias!</div>';
  }).withFailureHandler(function(e){
    card.innerHTML='<h2 class="serif" style="font-size:1.05rem">'+esc(v.titulo)+'</h2><div class="msg err">'+esc(e&&e.message)+'</div>';
  }).emitirVoto(v.id, k);
}

/* ================= DOCUMENTOS OFICIALES ================= */
/* Datos del centro (se rellenan solos en todos los documentos). Se guardan en este navegador. */
var DCFG_KEY='consejo_doc_cfg_v1';
function dcfgGet(){
  var def={centro:'CEIP San Sebastián',localidad:'La Puebla del Río',curso:'2026/2027',director:'',secretario:'',
    composicion:'Composición del Consejo Escolar (14 unidades · confírmala en Séneca):\n· Dirección: 1 (preside)\n· Jefatura de estudios: 1\n· Profesorado: ___\n· Familias (incluye 1 de la AMPA): ___\n· PAS: ___\n· Ayuntamiento: 1\n· Secretaría: 1 (voz, sin voto)\nEn esta convocatoria se renuevan: ___ (Séneca lo indica).'};
  try{var s=JSON.parse(localStorage.getItem(DCFG_KEY)||'{}');for(var k in def){if(s[k]!=null&&s[k]!=='')def[k]=s[k];}}catch(e){}
  return def;
}
var GUIA_HTML='<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Guía de uso · Consejo Escolar</title>'
+'<style>:root{--vino:#0f4d31;--verde:#1c6b45;--tinta:#15231c;--gris:#5b6b61;--linea:#dde5dd;--crema:#f6f9f5;--oro:#9a6b12;--oroSuave:#f6edd8}'
+'*{box-sizing:border-box}body{margin:0;background:#eef2ed;color:var(--tinta);font-family:Georgia,serif;line-height:1.6}'
+'.hoja{max-width:820px;margin:22px auto;background:#fff;padding:36px 42px;box-shadow:0 6px 24px rgba(20,40,30,.1)}'
+'h1{font-size:1.6rem;margin:0;color:var(--vino)}.sub{color:var(--gris);font-size:.95rem;margin:2px 0 0}'
+'.memb{border-bottom:2px solid var(--vino);padding-bottom:12px;margin-bottom:18px}'
+'h2{font-size:1.12rem;color:var(--verde);border-bottom:1px solid var(--linea);padding-bottom:5px;margin:24px 0 10px}'
+'h3{font-size:1rem;color:var(--vino);margin:16px 0 4px}p,li{font-size:.95rem}ol,ul{padding-left:22px}li{margin-bottom:6px}'
+'.paso{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}.num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--verde);color:#fff;font-family:Arial,sans-serif;font-weight:700;font-size:.85rem;display:flex;align-items:center;justify-content:center;margin-top:1px}'
+'.nota{background:var(--crema);border-left:4px solid var(--verde);border-radius:0 8px 8px 0;padding:11px 15px;margin:12px 0;font-size:.9rem}'
+'.aviso{background:var(--oroSuave);border-left:4px solid var(--oro);border-radius:0 8px 8px 0;padding:11px 15px;margin:12px 0;font-size:.9rem}'
+'.tag{display:inline-block;background:var(--crema);border:1px solid var(--linea);border-radius:6px;padding:1px 7px;font-family:Arial,sans-serif;font-size:.82rem;color:var(--vino);font-weight:700}'

var _pullDoc=null, _pullVots=[];
function pullInit(n){
  _pullDoc=n;
  if(!ADMINPASS){ el('pullInner').innerHTML='<div class="row"><div class="grow"><input type="password" id="pullPw" placeholder="Contraseña de administración" onkeydown="if(event.key===\'Enter\')pullAuth()"></div><button class="btn ghost sm" onclick="pullAuth()">Ver votaciones</button></div>'; return; }
  pullLoad();

function pullAuth(){
  var pw=el('pullPw').value; el('pullMsg').innerHTML='<span class="spin"></span>';
  google.script.run.withSuccessHandler(function(ok){ if(!ok){el('pullMsg').innerHTML='<div class="msg err">Contraseña incorrecta.</div>';return;} ADMINPASS=pw; el('pullMsg').innerHTML=''; pullLoad(); })
   .withFailureHandler(function(e){el('pullMsg').innerHTML='<div class="msg err">'+esc(e&&e.message)+'</div>';}).adminEntrar(pw);
}
function pullLoad(){
  el('pullInner').innerHTML='<span class="spin"></span>';
  google.script.run.withSuccessHandler(function(list){
    _pullVots=list||[];
    if(!_pullVots.length){ el('pullInner').innerHTML='<div class="small">No hay votaciones creadas en la app. Créalas en la pestaña Administración.</div>'; return; }
    var opt=_pullVots.map(function(v,i){return '<option value="'+i+'">'+esc(v.titulo)+' — '+v.votos+' votos ('+(v.estado==='abierta'?'abierta':'cerrada')+')</option>';}).join('');
    el('pullInner').innerHTML='<div class="row"><select id="pullSel" style="flex:1;min-width:160px">'+opt+'</select><button class="btn sm" onclick="pullFill()">📥 Rellenar acta</button></div>';
  }).withFailureHandler(function(e){el('pullInner').innerHTML='<div class="msg err">'+esc(e&&e.message)+'</div>';}).listarVotaciones(ADMINPASS);
}
function pullFill(){
  var i=+el('pullSel').value, v=_pullVots[i]; if(!v)return;
  el('pullMsg').innerHTML='<span class="spin"></span>';
  google.script.run.withSuccessHandler(function(r){
    var doc=DOCS.filter(function(x){return x.n===_pullDoc;})[0];
    el('docSheet').innerHTML=doc.body(dcfgGet(), r);
    el('pullMsg').innerHTML='<div class="msg ok">Acta rellena con «'+esc(v.titulo)+'» ('+r.total+' votos). Revisa la composición de la mesa y edita lo que necesites.</div>';
  }).withFailureHandler(function(e){el('pullMsg').innerHTML='<div class="msg err">'+esc(e&&e.message)+'</div>';}).getResultados(ADMINPASS, v.id);
}

/* ---- helpers de actas de mesa que se rellenan con una votación de la app (res) ---- */
function _ordena(res){ return (res&&res.opciones?res.opciones.slice():[]).sort(function(a,b){return b.votos-a.votos;}); }
function listaCand(res,siglas){                 /* "Se da lectura a las candidaturas presentadas" */
  var o=_ordena(res);
  if(o.length) return o.map(function(x){return 'D./D.ª '+esc(x.opcion)+(siglas?' ('+B('sm')+' *)':'');}).join('<br>');
  var r=[]; for(var i=0;i<3;i++) r.push('D./D.ª '+B('lg')+(siglas?' ('+B('sm')+' *)':'')); return r.join('<br>');
}
function listaVotos(res){                        /* "Los votos válidos son los siguientes" */
  var o=_ordena(res);
  if(o.length) return o.map(function(x){return 'D./D.ª '+esc(x.opcion)+' &mdash; Nº de votos <b>'+x.votos+'</b>';}).join('<br>');
  var r=[]; for(var i=0;i<4;i++) r.push('D./D.ª '+B('lg')+' Nº de votos '+B('sm')); return r.join('<br>');
}
function listaElegidos(res,single,siglas){       /* "En consecuencia, son elegidos/as" */
  var o=_ordena(res);
  if(o.length){ var top=single?o.slice(0,1):o; return top.map(function(x){return 'D./D.ª '+esc(x.opcion)+(siglas?' ('+B('sm')+' *)':'');}).join('<br>'); }
  if(single) return 'D./D.ª '+B('lg');
  var r=[]; for(var i=0;i<2;i++) r.push('D./D.ª '+B('lg')+(siglas?' ('+B('sm')+' *)':'')); return r.join('<br>');
}
function bloqueEscrutinioRes(res,noPres){        /* recuento; con res: válidos=total, blanco=0, nulos=0 (la app no admite nulos/blancos) */
  var t=res?res.total:null;
  return '<p>Se declara abierta la votación a las '+B('sm')+' horas.</p>'
   +'<p>Finalizada la votación, se procede al escrutinio de votos, con el siguiente resultado:</p>'
   +'<p>Votos válidos: '+(res?'<b>'+t+'</b>':B('sm'))+' &nbsp;&nbsp; Votos en blanco: '+(res?'<b>0</b>':B('sm'))+' &nbsp;&nbsp; Votos nulos: '+(res?'<b>0</b>':B('sm'))
   +'<br><b>TOTAL VOTOS EMITIDOS:</b> '+(res?'<b>'+t+'</b>':B('sm'))+(noPres?'. De ellos, '+B('sm')+' por la modalidad no presencial.':'')+'</p>'
   +'<p>Los votos válidos son los siguientes:</p><p>'+listaVotos(res)+'</p>';
}

/* ---------- ADMIN ---------- */
function admEntrar(){
  var pw=el('admPw').value;
  el('admLoginMsg').innerHTML='<div class="center"><span class="spin"></span></div>';
  google.script.run.withSuccessHandler(function(ok){
    if(!ok){ el('admLoginMsg').innerHTML='<div class="msg err">Contraseña incorrecta.</div>'; return; }
    ADMINPASS=pw; el('admLogin').hidden=true; el('admPanel').hidden=false; renderAdmin();
  }).withFailureHandler(function(e){ el('admLoginMsg').innerHTML='<div class="msg err">'+esc(e&&e.message)+'</div>'; }).adminEntrar(pw);
}
function renderAdmin(){
  var h='';
  /* crear votación */
  h+='<div class="card"><h2 class="serif">Nueva votación anónima</h2><p class="lead">El claustro verá esto en la pestaña Votar. Una opción por línea.</p>';
  h+='<label>Título / pregunta</label><input type="text" id="nvTit" placeholder="p. ej. Aprobación del proyecto de dirección">';
  h+='<label style="margin-top:8px">Opciones (una por línea)</label><textarea id="nvOps" placeholder="Sí\nNo\nAbstención"></textarea>';
  h+='<div style="margin-top:10px"><button class="btn" onclick="crearVot()">+ Crear y abrir votación</button></div><div id="nvMsg"></div></div>';
  /* votaciones existentes */
  h+='<div class="eyebrow">Votaciones</div><div id="admVots" class="center"><span class="spin"></span></div>';
  /* listados */
  h+='<div class="eyebrow">Listados para sorteos</div>';
  h+='<div class="card"><p class="lead">Pega aquí los listados (un nombre por línea). Se guardan para reutilizarlos en los sorteos.</p><div id="admListados"></div></div>';
  /* sorteo */
  h+='<div class="eyebrow">Sorteo</div><div id="admSorteo"></div>';
  /* config */
  h+='<div class="eyebrow">Configuración</div><div id="admConfig" class="center"><span class="spin"></span></div>';
  /* pruebas */
  h+='<div class="eyebrow">Pruebas</div><div class="card"><p class="lead">Practica sin miedo: crea votaciones y sorteos de prueba y bórralos cuando quieras. Estos botones <b>no borran tus listados/censos</b>.</p>';
  h+='<div class="row"><button class="btn ghost" onclick="borrarSorteosBtn()">Vaciar registro de sorteos</button><button class="btn red" onclick="reiniciarBtn()">Reiniciar TODO (votaciones + votos + sorteos)</button></div><div id="pruMsg"></div></div>';
  el('admPanel').innerHTML=h;
  cargarVots(); cargarListados(); renderSorteo(); cargarConfig();
}
function borrarVot(id){
  if(!confirm('¿Borrar esta votación y sus votos? No se puede deshacer.'))return;
  google.script.run.withSuccessHandler(cargarVots).withFailureHandler(function(e){alert(e&&e.message);}).borrarVotacion(ADMINPASS,id);
}
function borrarSorteosBtn(){
  if(!confirm('¿Vaciar el registro de sorteos? (No afecta a listados ni votaciones.)'))return;
  el('pruMsg').innerHTML='<span class="spin"></span>';
  google.script.run.withSuccessHandler(function(){el('pruMsg').innerHTML='<div class="msg ok">Registro de sorteos vaciado.</div>';}).withFailureHandler(function(e){el('pruMsg').innerHTML='<div class="msg err">'+esc(e&&e.message)+'</div>';}).borrarSorteos(ADMINPASS);
}
function reiniciarBtn(){
  if(!confirm('Esto borra TODAS las votaciones, sus votos y los sorteos (los listados se conservan). ¿Continuar?'))return;
  if(!confirm('Última confirmación: se borran votaciones, votos y sorteos. ¿Seguro?'))return;
  el('pruMsg').innerHTML='<span class="spin"></span>';
  google.script.run.withSuccessHandler(function(){el('pruMsg').innerHTML='<div class="msg ok">Listo. Datos de prueba borrados.</div>';cargarVots();}).withFailureHandler(function(e){el('pruMsg').innerHTML='<div class="msg err">'+esc(e&&e.message)+'</div>';}).reiniciarPruebas(ADMINPASS);
}

function crearVot(){
  var tit=el('nvTit').value, ops=el('nvOps').value.split('\n').map(function(x){return x.trim();}).filter(Boolean);
  el('nvMsg').innerHTML='<div class="center"><span class="spin"></span></div>';
  google.script.run.withSuccessHandler(function(){
    el('nvTit').value='';el('nvOps').value='';el('nvMsg').innerHTML='<div class="msg ok">Votación creada y abierta.</div>';cargarVots();
  }).withFailureHandler(function(e){el('nvMsg').innerHTML='<div class="msg err">'+esc(e&&e.message)+'</div>';}).crearVotacion(ADMINPASS,tit,ops);
}
function cargarVots(){
  google.script.run.withSuccessHandler(function(list){
    var h='';
    if(!list.length)h='<div class="card center" style="color:var(--muted)">Aún no hay votaciones.</div>';
    list.forEach(function(v){
      h+='<div class="vlist"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="vt" style="flex:1">'+esc(v.titulo)+'</span>';
      h+='<span class="pill '+(v.estado==='abierta'?'on':'off')+'">'+(v.estado==='abierta'?'Abierta':'Cerrada')+'</span>';
      h+='<span class="small">'+v.votos+' voto'+(v.votos===1?'':'s')+'</span></div>';
      h+='<div class="row" style="margin-top:8px">';
      if(v.estado==='abierta')h+='<button class="btn ghost sm" onclick="estadoVot(\''+v.id+'\',\'cerrada\')">Cerrar</button>';
      else h+='<button class="btn ghost sm" onclick="estadoVot(\''+v.id+'\',\'abierta\')">Reabrir</button>';
      h+='<button class="btn sm" onclick="verRes(\''+v.id+'\',\''+esc(v.titulo).replace(/\x27/g,"")+'\')">Ver resultados</button>';
      h+='<button class="btn red sm" onclick="borrarVot(\''+v.id+'\')">Borrar</button></div>';
      h+='<div id="res-'+v.id+'"></div></div>';
    });
    el('admVots').innerHTML=h;
  }).withFailureHandler(function(e){el('admVots').innerHTML='<div class="msg err">'+esc(e&&e.message)+'</div>';}).listarVotaciones(ADMINPASS);
}
function estadoVot(id,est){google.script.run.withSuccessHandler(cargarVots).cambiarEstadoVotacion(ADMINPASS,id,est);}
function verRes(id,tit){
  var box=el('res-'+id);box.innerHTML='<div class="center"><span class="spin"></span></div>';
  google.script.run.withSuccessHandler(function(r){
    var h='<div style="margin-top:10px">';var max=1;r.opciones.forEach(function(o){if(o.votos>max)max=o.votos;});
    r.opciones.forEach(function(o){
      var pct=Math.round(o.votos/max*100);
      h+='<div class="res-row"><span class="nm">'+esc(o.opcion)+'</span><span class="track"><span class="bar-res" style="width:'+pct+'%"></span></span><span class="n">'+o.votos+'</span></div>';
    });
    h+='<div class="small" style="margin-top:4px">Total: '+r.total+' votos</div>';
    h+='<button class="btn ghost sm" style="margin-top:8px" onclick="actaVot(\''+id+'\',\''+esc(tit)+'\')">📄 Acta editable / PDF</button><div id="acta-'+id+'"></div></div>';
    box.innerHTML=h; box._data={tit:tit,r:r};
    window['_res_'+id]=r;
  }).withFailureHandler(function(e){box.innerHTML='<div class="msg err">'+esc(e&&e.message)+'</div>';}).getResultados(ADMINPASS,id);
}
function actaVot(id,tit){
  var r=window['_res_'+id]; if(!r)return; var c=dcfgGet();
  var filas=r.opciones.map(function(o){return esc(o.opcion)+' &mdash; <b>'+o.votos+'</b> voto'+(o.votos===1?'':'s');}).join('<br>');
  var hora=horaAhora();
  var cuerpo=cab(c)
   +'<h1>Acta de votación</h1>'
   +'<p>En '+FV(c.localidad)+', siendo las '+hora+' horas del día '+fLarga(new Date())+', bajo la presidencia del Sr./Sra. Director/a del Centro '+FV(c.centro)+', se somete a votación el siguiente asunto:</p>'
   +'<div class="od"><b>Asunto:</b> '+esc(tit)+'</div>'
   +'<p>Realizada la votación de forma <b>anónima</b> (el sistema garantiza un único voto por persona sin registrar el sentido de cada voto), se obtiene el siguiente resultado:</p>'
   +'<p>'+filas+'<br><b>TOTAL votos emitidos: '+r.total+'</b></p>'
   +'<p>Y sin más asuntos que tratar, se levanta la sesión a las '+hora+' horas, lo que como Secretario/a certifico, con el Vº.Bº. de la Presidencia.</p>'
   +firmasOficial(c);
  mostrarActaEditable('acta-'+id, 'Acta de votación', cuerpo);
}

/* listados */
function cargarListados(){
  google.script.run.withSuccessHandler(function(l){LISTADOS=l||[];pintaListados();if(!SECTORES)renderSorteo();else pintarSectoresSelects();}).getListados(ADMINPASS);
}
function pintaListados(){
  var box=el('admListados');
  var nombres=['Familias','Profesorado'];
  LISTADOS.forEach(function(l){if(nombres.indexOf(l.nombre)<0)nombres.push(l.nombre);});
  var h='';
  nombres.forEach(function(nom){
    var ld=LISTADOS.filter(function(x){return x.nombre===nom;})[0];
    var txt=ld?ld.datos.join('\n'):'';
    var n=ld?ld.datos.length:0;
    h+='<div style="margin-bottom:12px"><label>'+esc(nom)+' <span class="small">('+n+')</span></label>';
    h+='<textarea id="ld-'+esc(nom)+'" placeholder="Apellidos, Nombre\n...">'+esc(txt)+'</textarea>';
    h+='<div class="row" style="margin-top:6px"><button class="btn ghost sm" onclick="guardarLd(\''+esc(nom)+'\')">Guardar «'+esc(nom)+'»</button></div>';
    h+='<div id="ldm-'+esc(nom)+'"></div></div>';
  });
  box.innerHTML=h;
}
function guardarLd(nom){
  var txt=el('ld-'+nom).value;
  el('ldm-'+nom).innerHTML='<span class="spin"></span>';
  google.script.run.withSuccessHandler(function(n){el('ldm-'+nom).innerHTML='<div class="msg ok">Guardado: '+n+' personas.</div>';cargarListados();}).withFailureHandler(function(e){el('ldm-'+nom).innerHTML='<div class="msg err">'+esc(e&&e.message)+'</div>';}).guardarListado(ADMINPASS,nom,txt);
}

/* sorteo */
function presetSorteo(t){
  if(t==='je'){ SECTORES=[{nombre:'Familias',titulares:1,suplentes:3,listado:'Familias'},{nombre:'Profesorado',titulares:1,suplentes:3,listado:'Profesorado'},{nombre:'PAS',titulares:1,suplentes:2,listado:''}]; var e=el('soTit'); if(e)e.value='Sorteo de la Junta Electoral'; }
  else if(t==='familias'){ SECTORES=[{nombre:'Familias',titulares:4,suplentes:4,listado:'Familias'}]; var e2=el('soTit'); if(e2)e2.value='Sorteo de la Mesa Electoral de familias'; }
  else if(t==='alumnado'){ SECTORES=[{nombre:'Alumnado',titulares:4,suplentes:4,listado:'Alumnado'}]; var e3=el('soTit'); if(e3)e3.value='Sorteo de la Mesa Electoral del alumnado'; }
  pintarSectoresSelects();
}
function renderSorteo(){
  if(!SECTORES)SECTORES=[{nombre:'Familias',titulares:1,suplentes:3,listado:'Familias'},{nombre:'Profesorado',titulares:1,suplentes:3,listado:'Profesorado'},{nombre:'PAS',titulares:1,suplentes:2,listado:''}];
  var h='<div class="card"><p class="lead">Ajusta los sectores y de qué listado sale cada uno. La semilla es un número que anuncias en voz alta; con la misma semilla y listado el resultado es idéntico (transparente).</p>';
  h+='<label>Preajustes oficiales (Orden 7/10/2010)</label><div class="row" style="margin-bottom:6px"><button class="btn ghost sm" onclick="presetSorteo(\'je\')">Junta Electoral</button><button class="btn ghost sm" onclick="presetSorteo(\'familias\')">Mesa de familias</button><button class="btn ghost sm" onclick="presetSorteo(\'alumnado\')">Mesa de alumnado</button></div>';
  h+='<p class="hint" style="margin-bottom:10px">Junta Electoral: 1 titular por sector (profesorado, familias, PAS) + suplentes. Mesa de familias / de alumnado: 4 vocales titulares + suplentes (el/la director/a preside, no se sortea).</p>';
  h+='<div id="secBox"></div><button class="btn ghost sm" onclick="addSector()">+ Añadir sector</button>';
  h+='<div class="row" style="margin-top:12px"><div class="grow"><label>Semilla</label><input type="text" id="soSeed" placeholder="p. ej. 47"></div><button class="btn ghost" onclick="el(\'soSeed\').value=String(Math.floor(1000+Math.random()*9000))">Al azar</button></div>';
  h+='<label style="margin-top:10px">Título del sorteo</label><input type="text" id="soTit" value="Sorteo de la Junta Electoral">';
  h+='<div class="row" style="margin-top:12px"><button class="btn gold" onclick="hacerSorteo()">🎲 Realizar sorteo</button></div><div id="soMsg"></div><div id="soRes"></div></div>';
  el('admSorteo').innerHTML=h;
  pintarSectoresSelects();
}
function pintarSectoresSelects(){
  var box=el('secBox'); if(!box)return;
  var opts='<option value="">— pegar a mano abajo —</option>'+LISTADOS.map(function(l){return '<option value="'+esc(l.nombre)+'">'+esc(l.nombre)+' ('+l.datos.length+')</option>';}).join('');
  var h='';
  SECTORES.forEach(function(s,i){
    h+='<div class="sector"><div class="shead"><input class="sn" value="'+esc(s.nombre)+'" data-i="'+i+'" data-f="nombre" oninput="edSec(this)">';
    h+='<span class="small">Titulares</span><input class="mini" type="number" min="0" max="9" value="'+s.titulares+'" data-i="'+i+'" data-f="titulares" oninput="edSec(this)">';
    h+='<span class="small">Suplentes</span><input class="mini" type="number" min="0" max="20" value="'+s.suplentes+'" data-i="'+i+'" data-f="suplentes" oninput="edSec(this)">';
    h+='<button class="rmx" onclick="delSector('+i+')">&times;</button></div>';
    h+='<label>Listado</label><select data-i="'+i+'" data-f="listado" onchange="edSec(this)">'+opts.replace('value="'+esc(s.listado)+'"','value="'+esc(s.listado)+'" selected')+'</select>';
    if(!s.listado){ h+='<label style="margin-top:6px">Censo a mano (uno por línea)</label><textarea id="sc-'+i+'" placeholder="Nombre\n...">'+esc(s.censo||'')+'</textarea>'; }
    h+='</div>';
  });
  box.innerHTML=h;
}
function edSec(elm){var i=+elm.getAttribute('data-i'),f=elm.getAttribute('data-f');if(f==='titulares'||f==='suplentes')SECTORES[i][f]=Math.max(0,parseInt(elm.value)||0);else SECTORES[i][f]=elm.value;if(f==='listado')pintarSectoresSelects();}
function addSector(){SECTORES.push({nombre:'Nuevo',titulares:1,suplentes:1,listado:''});pintarSectoresSelects();}
function delSector(i){SECTORES.splice(i,1);pintarSectoresSelects();}
function hacerSorteo(){
  var seed=el('soSeed').value, tit=el('soTit').value;
  var sect=SECTORES.map(function(s,i){
    var censo=[];
    if(s.listado){var ld=LISTADOS.filter(function(x){return x.nombre===s.listado;})[0];censo=ld?ld.datos:[];}
    else{var t=el('sc-'+i);censo=t?t.value.split('\n').map(function(x){return x.trim();}).filter(Boolean):[];}
    return {nombre:s.nombre,titulares:s.titulares,suplentes:s.suplentes,censo:censo};
  });
  el('soMsg').innerHTML='<div class="center"><span class="spin"></span></div>';
  google.script.run.withSuccessHandler(function(r){
    el('soMsg').innerHTML='';
    var h='<div class="msg warn" style="margin-top:10px">Semilla <b>'+esc(r.semilla)+'</b> · '+esc(r.fecha)+'. Reproducible con la misma semilla y listado.</div>';
    r.resultado.forEach(function(s){
      h+='<div class="vlist"><div class="vt">'+esc(s.nombre)+'</div><ol style="margin:6px 0 0;padding-left:20px">';
      s.titulares.forEach(function(p){h+='<li><b>'+esc(p)+'</b> <span class="small">— titular</span></li>';});
      s.suplentes.forEach(function(p,k){h+='<li>'+esc(p)+' <span class="small">— suplente '+(k+1)+'º</span></li>';});
      h+='</ol></div>';
    });
    h+='<button class="btn ghost sm" style="margin-top:6px" onclick="actaSorteo()">📄 Acta editable / PDF</button><div id="soActa"></div>';
    el('soRes').innerHTML=h; window._sorteo={tit:tit,r:r};
  }).withFailureHandler(function(e){el('soMsg').innerHTML='<div class="msg err">'+esc(e&&e.message)+'</div>';}).realizarSorteo(ADMINPASS,tit,seed,sect);
}
function actaSorteo(){
  var s=window._sorteo; if(!s)return; var c=dcfgGet();
  var secs='';
  s.r.resultado.forEach(function(sec){
    var lines=[];
    sec.titulares.forEach(function(p){lines.push('D./D.ª '+esc(p)+' &mdash; <b>Titular</b>');});
    sec.suplentes.forEach(function(p,j){lines.push('D./D.ª '+esc(p)+' &mdash; Suplente '+(j+1)+'º');});
    if(!lines.length) return;
    secs+='<h3>'+esc(sec.nombre)+'</h3><p>'+lines.join('<br>')+'</p>';
  });
  var hora=horaAhora();
  var cuerpo=cab(c)
   +'<h1>Acta del sorteo público &mdash; '+esc(s.tit)+'</h1>'
   +'<p>En '+FV(c.localidad)+', siendo las '+hora+' horas del día '+esc(s.r.fecha)+', bajo la presidencia del Sr./Sra. Director/a del Centro '+FV(c.centro)+', se procede a la celebración del sorteo público, conforme a la Orden de 7 de octubre de 2010 y a la Resolución de 7 de septiembre de 2026 (BOJA núm. 177).</p>'
   +'<div class="seed"><b>Número (semilla) del sorteo:</b> '+esc(s.r.semilla)+' &nbsp;·&nbsp; anunciado públicamente antes de su realización.<br>Con la misma semilla y el mismo listado el resultado es idéntico, por lo que es <b>reproducible y verificable</b> por cualquier persona interesada.</p></div>'
   +'<p>Realizado el sorteo, resultan designadas las siguientes personas:</p>'
   +secs
   +'<p>El resultado se notificará personalmente a las personas designadas, a quienes se convocará, en su caso, para el acto de constitución correspondiente.</p>'
   +'<p>Y sin más asuntos que tratar, se levanta la sesión a las '+hora+' horas del día indicado.</p>'
   +firmasOficial(c);
  mostrarActaEditable('soActa', 'Acta de sorteo', cuerpo);
}

/* config */
function cargarConfig(){
  google.script.run.withSuccessHandler(function(c){
    var h='<div class="card"><label>Correos para los avisos (separados por comas)</label><input type="text" id="cfEmails" value="'+esc(c.emails)+'">';
    h+='<label style="margin-top:8px">Cambiar contraseña (dejar vacío para no cambiar)</label><input type="password" id="cfPw" placeholder="Nueva contraseña">';
    h+='<div class="row" style="margin-top:10px"><button class="btn" onclick="guardarCfg()">Guardar configuración</button><button class="btn ghost" onclick="activarAviso()">📧 Activar aviso diario</button></div><div id="cfMsg"></div>';
    h+='<p class="hint">Enlace de la app: <span style="word-break:break-all">'+esc(c.url)+'</span></p></div>';
    el('admConfig').innerHTML=h;
  }).withFailureHandler(function(e){el('admConfig').innerHTML='<div class="msg err">'+esc(e&&e.message)+'</div>';}).getConfig(ADMINPASS);
}
function guardarCfg(){
  var emails=el('cfEmails').value, pw=el('cfPw').value;
  el('cfMsg').innerHTML='<span class="spin"></span>';
  google.script.run.withSuccessHandler(function(){el('cfMsg').innerHTML='<div class="msg ok">Guardado.</div>';if(pw)ADMINPASS=pw;el('cfPw').value='';}).withFailureHandler(function(e){el('cfMsg').innerHTML='<div class="msg err">'+esc(e&&e.message)+'</div>';}).adminGuardarConfig(ADMINPASS,pw,emails);
}
function activarAviso(){
  el('cfMsg').innerHTML='<span class="spin"></span>';
  google.script.run.withSuccessHandler(function(){el('cfMsg').innerHTML='<div class="msg ok">Aviso diario activado (7:00).</div>';}).withFailureHandler(function(e){el('cfMsg').innerHTML='<div class="msg err">'+esc(e&&e.message)+'</div>';}).crearTriggerDiario();
}

/* imprimir genérico (actas dinámicas de votación y sorteo) */
function imprimir(titulo,cuerpo){
  var w=window.open('','_blank'); if(!w){alert('Permite las ventanas emergentes para imprimir.');return;}
  var css='body{font-family:Georgia,serif;color:#15231c;margin:26px;line-height:1.5}h1{font-size:18px;margin:0 0 2px}h2{font-size:12px;color:#555;font-weight:400;margin:0 0 14px}h3{font-size:13px;color:#0f4d31;border-bottom:2px solid #1c6b45;padding-bottom:3px;margin:16px 0 6px}table{border-collapse:collapse;width:100%;font-size:12px;font-family:Arial,sans-serif;margin-bottom:6px}th,td{border:1px solid #999;padding:6px 9px;text-align:left}th{background:#0f4d31;color:#fff}.c{text-align:center}.meta{font-size:12px;background:#f6edd8;border:1px solid #d9c58a;border-radius:6px;padding:10px;font-family:Arial,sans-serif}.nota{font-size:11px;color:#555;font-family:Arial,sans-serif}.firmas{margin-top:38px;display:flex;justify-content:space-between;font-size:12px;font-family:Arial,sans-serif}@media print{@page{size:A4 portrait;margin:16mm}}';
  w.document.open();
  w.document.write('<!doctype html><html lang="es"><head><meta charset="utf-8"><title>'+titulo+'</title><style>'+css+'</style></head><body>'+cuerpo+'<scr'+'ipt>window.onload=function(){setTimeout(function(){window.print();},350);};</scr'+'ipt></body></html>');
  w.document.close();
}
</script>
